# ============================================================
# VALOR 可实施原型系统 —— 项目元数据与依赖
# 对齐规范 §72 依赖清单；Python >= 3.11（开发环境 3.14）
# ============================================================
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valor"
version = "0.2.0"
description = "权利感知、质量可验证与用途可审计的数据交易原型系统（VALOR）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "VALOR" }]
# 依赖声明（规范 §72）。torch 体积较大，标注为可选，避免基础安装过重。
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "networkx>=3.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# 标签质量复现（QP-02 Confident Learning reference）所需
quality = ["cleanlab>=2.0"]
# 深度学习估值器（Data Shapley 等）所需
torch = ["torch>=2.0"]
# parquet 数据格式所需
parquet = ["pyarrow>=14.0"]
# 测试
dev = ["pytest>=8.0"]
# 代理下载（MNIST 等经 SOCKS5 代理拉取）所需
proxy = ["pysocks>=1.7"]

[tool.setuptools.packages.find]
include = ["valor*"]

[tool.setuptools.package-data]
valor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
